[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Topilot"
version = "0.0.1"
description = "在Telegram Bot中使用Copilot Cli"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-telegram-bot>=22.0,<23"
]

[project.scripts]
topilot = "topilot.cli.main:main"
cit = "topilot.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
