[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Topilot"
version = "0.0.1"
description = "在Telegram Bot中使用Copilot Cli"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-telegram-bot>=22.0,<23"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=5,<7"
]

[tool.pytest.ini_options]
addopts = "--cov=src/topilot --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/topilot"]

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
  "src/topilot/main.py"
]

[project.scripts]
topilot = "topilot.cli.main:main"
cit = "topilot.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
